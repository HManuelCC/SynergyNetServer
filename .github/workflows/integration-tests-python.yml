name: Integration Tests

on:
  push:
    branches: [main, python_client]
  pull_request:
    branches: [main, python_client]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build docker images
        run: docker build -t synergynetserver:latest .

      - name: Run container
        run: |
          docker run -d \
            -p 4430:4430 \
            --name synergynetserver \
            synergynetserver:latest

      - name: Wait for server to be ready
        run: sleep 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Clients/Python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Python HTTP demo server
        run: |
          cd Clients/Python
          nohup python cmd/demo.py > server.log 2>&1 &

      - name: Wait for Python server to start
        run: sleep 5

      - name: Test HTTP endpoint
        run: |
          echo "Probando endpoint /login_prueba..."
          RESPONSE=$(curl -s -w "%{http_code}" -o response.json "http://localhost:8080/login_prueba?username=test_user")
          echo "Código de respuesta: $RESPONSE"

          if [ "$RESPONSE" -ne 200 ]; then
            echo "El endpoint devolvió un código distinto de 200"
            echo "Respuesta del servidor:"
            cat response.json || true
            exit 1
          fi

          echo "Endpoint respondió 200 OK"
          echo "Contenido devuelto:"
          cat response.json

          # Validar que la respuesta tenga el campo "message" con el texto esperado
          if ! grep -q '"message"' response.json; then
            echo "La respuesta no contiene el campo 'message'"
            exit 1
          fi

          echo "Respuesta válida y contiene 'message'"

      - name: Cleanup
        if: always()
        run: |
          docker logs synergynetserver || true
          docker stop synergynetserver
          docker rm synergynetserver

      - name: Notify failure
        if: failure()
        run: echo "Algo salió mal en la integración"
